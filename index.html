<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonathan's terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.terminal/js/jquery.terminal.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery.terminal/css/jquery.terminal.min.css"/>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 95%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }
        #terminal {
            width: 90%;
            height: 90%;
            position: relative;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(32, 255, 100, 0.6); /* Brighter glow */
            overflow: hidden;
        }
        #terminal {
            --color: rgba(32, 255, 100, 0.95); /* Brighter green text */
            --background: rgba(0, 0, 0, 0.9);
            --size: 1.2;
        }
        .terminal .terminal-output div div {
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            text-shadow: 0 0 2px rgba(32, 255, 100, 0.9); /* Brighter text shadow */
        }

        /* CRT screen effect */
        #terminal::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                rgba(32, 255, 100, 0.15) 50%, /* Brighter scan lines */
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            animation: scanlines 1s linear infinite;
            z-index: 999;
            opacity: 0.6;
        }

        /* Screen curvature effect */
        #terminal::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(
                    circle at center,
                    transparent 0%,
                    rgba(0, 0, 0, 0.1) 50%,
                    rgba(0, 0, 0, 0.4) 100%
                ),
                radial-gradient(
                    circle at 50% 50%,
                    rgba(32, 255, 100, 0.08) 0%, /* Brighter glow in curvature */
                    transparent 50%
                );
            border-radius: 20px;
            pointer-events: none;
            z-index: 998;
        }

        @keyframes scanlines {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 0 4px;
            }
        }

        /* Flicker animation */
        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.9; }
            15% { opacity: 0.95; }
            20% { opacity: 0.97; }
            100% { opacity: 0.97; }
        }

        #terminal {
            animation: flicker 0.15s infinite;
        }

        /* Add after your existing styles */
        .crt-bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(
                circle at center,
                rgba(32, 255, 100, 0.2) 0%, /* Brighter bubbles */
                transparent 60%
            );
            animation: float 15s infinite linear;
            opacity: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(100%) translateX(-50%);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-20%) translateX(50%);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <div class="crt-bubbles"></div>
    <script>
        function createBubbles() {
            const bubblesContainer = document.querySelector('.crt-bubbles');
            const numberOfBubbles = 5;

            function createBubble() {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                
                // Random size between 50px and 150px
                const size = Math.random() * 100 + 50;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                
                // Random position
                bubble.style.left = `${Math.random() * 100}%`;
                
                // Random animation duration between 10 and 20 seconds
                bubble.style.animationDuration = `${Math.random() * 10 + 10}s`;
                
                bubblesContainer.appendChild(bubble);
                
                // Remove bubble after animation
                bubble.addEventListener('animationend', () => {
                    bubble.remove();
                    createBubble();
                });
            }

            // Create initial bubbles
            for (let i = 0; i < numberOfBubbles; i++) {
                setTimeout(() => createBubble(), i * 2000);
            }
        }

        // Call createBubbles after the page loads
        window.addEventListener('load', createBubbles);

        const randomTexts = ["What was Jonathan's PhD on?", "What is current research on?", "Where does he work at?", "What are his favorite things?", "What is his favorite quote?", "What is his Erdos number?","Can he ride a bicycle?","Can you tell me a secret about him?","Can I see the pictures he takes?"];
        let answerHistory = [];
        let firstClickIgnored = false;

        let commandHistory = [];

        function wrapText(text, width) {
            return text.split(' ').reduce((lines, word) => {
                if (!lines.length) return [word];
                let lastLine = lines[lines.length - 1];
                if ((lastLine + ' ' + word).length <= width) {
                    lines[lines.length - 1] = lastLine + ' ' + word;
                } else {
                    lines.push(word);
                }
                return lines;
            }, []).join('\n');
        }

        $('#terminal').click(function() {
            if (!firstClickIgnored) {
                firstClickIgnored = true;
                return;
            }
            const term = $('#terminal').terminal();
            const currentCommand = term.get_command();
            if (currentCommand == "" || randomTexts.includes(currentCommand)) {
                const randomText = randomTexts[Math.floor(Math.random() * randomTexts.length)];
                term.set_command(randomText);
            }
        }).terminal(function(command, term) {
            if (command.trim() === '') {
                return;
            }
            commandHistory.push(command);
            const fullChat = commandHistory.map((cmd, index) => {
                const answer = answerHistory[index] || '';
                return `${cmd}\n${answer}`;
            }).join('\n');
            const url = `https://openai-worker.tonton-tremblay.workers.dev/?prompt=${encodeURIComponent(fullChat)}`;
            term.echo('Processing...').freeze();
            const processingIndex = term.last_index();
            
            fetch(url)
                .then(response => response.text())
                .then(data => {
                    // term.update(-1, '');
                    term.remove_line(processingIndex);
                    term.echo('[[;#1e90ff;]' + data.replace(/^>+/gm, '') + ']',{keepWords: true});
                    answerHistory.push(data);
                })
                .catch(error => {
                    // term.update(-1, '');
                    term.remove_line(processingIndex);
                    term.echo('[[;#ff0000;]Error: ' + error.message + ']');
                })
                .finally(() => {
                    term.unfreeze();
                    term.scroll_to_bottom();
                });
        }, {
            greetings: "Welcome to Jonathan Tremblay's terminal",
            prompt: '[[;#ffcc00;]> ]',
            exitOnEsc: false,
            formatters: [
                {
                    regex: /[\s\S]+/,
                    replacement: function(string) {
                        return wrapText(string, this.cols);
                    }
                }
            ]            
        });
    </script>
</body>
</html>
